# OSV Scanner exceptions for advisories reported from Cargo.lock.
#
# Maestro currently ships a Windows portable bundle. The GTK3/glib advisories
# below are Tauri/Wry cross-platform Linux GTK dependencies recorded in the
# lockfile; `cargo tree --target x86_64-pc-windows-msvc -i gtk` and `-i glib`
# do not resolve them for the shipped target. Re-reviewed on 05/10/2026
# against the locked Tauri 2.12.0 graph, which selects Wry 0.57.0.
# Stable tauri-utils 2.10.1 selects urlpattern 0.6.0; its five UNIC
# advisories no longer apply. Eight earlier GTK advisories were withdrawn
# on 14/08/2026 in the native OSV records; their unused exceptions were
# removed as part of the 05/10 review. Only glib unsoundness and the
# proc-macro-error maintenance warning remain excluded for Windows.
# Revisit before adding Linux bundles, when upstream Tauri/Wry moves this
# stack, or no later than 03/11/2026.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-11-03
reason = "glib is a Linux GTK transitive dependency in Tauri/Wry and is not present in the shipped Windows target dependency tree."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2026-11-03
reason = "proc-macro-error is pulled through the Linux GTK macro stack; no patched upstream path is available in the current Tauri/Wry graph."
