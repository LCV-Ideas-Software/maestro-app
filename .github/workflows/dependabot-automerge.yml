name: Dependabot Automerge

on:
  workflow_run:
    workflows:
      - CodeQL
    types:
      - completed
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:

permissions: write-all

jobs:
  dependabot-automerge:
    name: Process Dependabot pull requests
    runs-on: ubuntu-latest
    permissions: write-all
    environment: dependabot-automation
    timeout-minutes: 15
    steps:
      - name: Process one guarded queue mutation
        uses: LCV-Ideas-Software/.github/dependabot-automerge@f696635ed718dfb1b9576a1e9bcb1173cc278901 # v1.0.1
        with:
          github_token: ${{ github.token }}
          automation_token: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          required_checks_json: '[{"name":"Dependency Review","app_id":15368},{"name":"Check index.html formatting","app_id":15368},{"name":"CodeQL","app_id":57789},{"name":"Repository hygiene","app_id":15368},{"name":"Rust gates (cargo --locked)","app_id":15368},{"name":"zizmor","app_id":57789}]'
          settle_timeout_seconds: "480"

concurrency:
  group: dependabot-automerge-${{ github.repository }}
  queue: max
  cancel-in-progress: false
