name: Dependabot Automerge
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read
jobs:
  enable-automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Wait for PR checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            state="$(gh pr view "$PR_URL" --json statusCheckRollup --jq '
              [
                .statusCheckRollup[]
                | select(.workflowName != "Dependabot Automerge")
                | select(.name != "StepSecurity Optional Checks")
                | select(.name != "StepSecurity Harden-Runner")
              ] as $checks
              | ([ $checks[] | select(.name == "CodeQL") ]) as $codeql
              | if ($checks | length) == 0 then "pending"
                elif any($checks[]; .status != "COMPLETED") then "pending"
                elif ($codeql | length) == 0 then "pending"
                elif any($codeql[]; .conclusion != "SUCCESS") then "failure"
                elif all($checks[]; (.conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL")) then "success"
                else "failure"
                end
            ')"

            case "$state" in
              success)
                echo "PR checks are green for $PR_URL."
                exit 0
                ;;
              failure)
                echo "::error::One or more PR checks failed for $PR_URL; refusing automerge."
                gh pr view "$PR_URL" --json statusCheckRollup --jq '
                  .statusCheckRollup[]
                  | select(.workflowName != "Dependabot Automerge")
                  | select(.name != "StepSecurity Optional Checks")
                  | select(.name != "StepSecurity Harden-Runner")
                  | [.workflowName, .name, .status, .conclusion]
                  | @tsv
                '
                exit 1
                ;;
              pending)
                echo "Waiting for PR checks, attempt ${attempt}/90."
                sleep 10
                ;;
              *)
                echo "::error::Unexpected PR check state: $state"
                exit 1
                ;;
            esac
          done

          echo "::error::Timed out waiting for PR checks."
          exit 1

      - name: Auto-approve Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved Dependabot dependency update after the configured PR checks passed."

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          VALIDATED_HEAD=""

          wait_for_checks() {
            for attempt in {1..90}; do
              # Read the rollup and the head commit in ONE query so the green
              # verdict provably belongs to that exact SHA; export it so the
              # merge below pins --match-head-commit to the validated head.
              pr_json="$(gh pr view "$PR_URL" --json statusCheckRollup,headRefOid)"
              head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
              state="$(printf '%s' "$pr_json" | jq -r '
                [
                  .statusCheckRollup[]
                  | select(.workflowName != "Dependabot Automerge")
                  | select(.name != "StepSecurity Optional Checks")
                  | select(.name != "StepSecurity Harden-Runner")
                ] as $checks
                | ([ $checks[] | select(.name == "CodeQL") ]) as $codeql
                | if ($checks | length) == 0 then "pending"
                  elif any($checks[]; .status != "COMPLETED") then "pending"
                  elif ($codeql | length) == 0 then "pending"
                  elif any($codeql[]; .conclusion != "SUCCESS") then "failure"
                  elif all($checks[]; (.conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL")) then "success"
                  else "failure"
                  end
              ')"

              case "$state" in
                success)
                  echo "PR checks are green for $PR_URL at ${head_sha}."
                  VALIDATED_HEAD="$head_sha"
                  return 0
                  ;;
                failure)
                  echo "::error::One or more PR checks failed for $PR_URL; refusing automerge."
                  gh pr view "$PR_URL" --json statusCheckRollup --jq '
                    .statusCheckRollup[]
                    | select(.workflowName != "Dependabot Automerge")
                    | select(.name != "StepSecurity Optional Checks")
                    | select(.name != "StepSecurity Harden-Runner")
                    | [.workflowName, .name, .status, .conclusion]
                    | @tsv
                  '
                  return 1
                  ;;
                pending)
                  echo "Waiting for PR checks, attempt ${attempt}/90."
                  sleep 10
                  ;;
                *)
                  echo "::error::Unexpected PR check state: $state"
                  return 1
                  ;;
              esac
            done

            echo "::error::Timed out waiting for PR checks."
            return 1
          }

          for merge_attempt in {1..3}; do
            state="$(gh pr view "$PR_URL" --json state --jq '.state')"
            if [ "$state" != "OPEN" ]; then
              echo "PR is no longer open; nothing to merge."
              exit 0
            fi

            # Re-validate checks on every attempt (including the first): a
            # dependabot rebase can land a new head after the standalone wait
            # step. wait_for_checks captures the validated head OID (from the
            # same query as the check rollup) into VALIDATED_HEAD; we pin the
            # merge to exactly that OID below, so the head we merge is provably
            # the head whose CodeQL result (and all checks) we just saw green.
            wait_for_checks

            head_oid="$VALIDATED_HEAD"
            merge_state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq '.mergeStateStatus')"

            case "$merge_state" in
              CLEAN|HAS_HOOKS)
                ;;
              BEHIND|UNKNOWN|UNSTABLE)
                echo "PR merge state is ${merge_state}; updating branch before retry ${merge_attempt}/3."
                gh pr update-branch "$PR_URL"
                sleep 30
                continue
                ;;
              DIRTY)
                echo "::error::PR has merge conflicts; refusing automerge."
                exit 1
                ;;
              *)
                echo "::error::PR merge state is ${merge_state}; refusing automerge."
                exit 1
                ;;
            esac

            merge_log="$(mktemp)"
            if gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$head_oid" >"$merge_log" 2>&1; then
              cat "$merge_log"
              exit 0
            fi

            cat "$merge_log"
            if grep -Eiq 'base branch was modified|not mergeable|merge conflict|not clean|head branch is not up to date' "$merge_log"; then
              if [ "$merge_attempt" = "3" ]; then
                echo "::error::PR stayed unmergeable after 3 attempts."
                exit 1
              fi
              echo "Merge failed because the branch is stale or temporarily unmergeable; updating branch before retry."
              gh pr update-branch "$PR_URL"
              sleep 30
              continue
            fi

            echo "::error::Unexpected merge failure."
            exit 1
          done

          echo "::error::Unable to merge PR after retries."
          exit 1
    timeout-minutes: 30
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
