name: Linear Release

on:
  workflow_call:
    inputs:
      version:
        description: Published Windows release tag
        required: true
        type: string
    secrets:
      LINEAR_ACCESS_KEY:
        description: Resolved from this job's linear-release environment
        required: false

permissions: {}

jobs:
  linear_release:
    name: Linear Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: linear-release
    permissions:
      contents: read
    steps:
      - name: Checkout published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync the published version with the official Linear action
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0.17.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          cli_version: v0.17.2
          version: ${{ inputs.version }}
          links: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}
