name: CodeQL
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "19 7 * * 2"
permissions: write-all
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    permissions: write-all
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CodeQL-compatible Rust sysroot
        if: matrix.language == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rust-src
          sysroot="$(rustup run 1.94.0 rustc --print sysroot)"
          test -d "$sysroot/lib/rustlib/src/rust/library"
          printf '%s\n' \
            "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT=$sysroot" \
            "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT_SRC=$sysroot/lib/rustlib/src/rust/library" \
            >> "$GITHUB_ENV"
      # The one remaining repository-local proc-macro extractor diagnostic is
      # run-specific evidence, not a standing suppression. See
      # ../CODEQL_RUST_EXTRACTION.md. Zero SARIF results remain mandatory below.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          dependency-caching: true
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/codeql-results

      - name: Enforce zero CodeQL findings
        shell: bash
        env:
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-results
        run: |
          set -euo pipefail
          mapfile -d '' sarif_files < <(
            find "$CODEQL_RESULTS" -type f -name '*.sarif' -print0
          )
          if [ "${#sarif_files[@]}" -eq 0 ]; then
            echo "::error::CodeQL produced no SARIF file to enforce." >&2
            exit 1
          fi
          finding_count="$(
            jq -s '[.[].runs[]?.results[]?] | length' "${sarif_files[@]}"
          )"
          if [ "$finding_count" -ne 0 ]; then
            finding_inventory="$(
              jq -cs '
                [
                  .[].runs[]?.results[]?
                  | {
                      ruleId: (.ruleId // "unknown"),
                      level: (.level // "unknown"),
                      path: (.locations[0]?.physicalLocation?.artifactLocation?.uri // "unknown"),
                      line: (.locations[0]?.physicalLocation?.region?.startLine // null)
                    }
                ]
              ' "${sarif_files[@]}"
            )"
            echo "::error::CodeQL reported $finding_count SARIF result(s); zero are allowed. Inventory: $finding_inventory" >&2
            exit 1
          fi
          echo "CodeQL reported zero SARIF results."

  analyze-legacy-category:
    permissions: write-all
    name: Analyze legacy CodeQL category
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          dependency-caching: true

      # Temporary compatibility analysis for the historical code-scanning category:
      # older main-branch analyses used this default workflow/job category. Retain it
      # until stale analyses age out; server-side required status checks are not configured.
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: ".github/workflows/codeql.yml:analyze"
          output: ${{ runner.temp }}/codeql-results

      - name: Enforce zero CodeQL findings
        shell: bash
        env:
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-results
        run: |
          set -euo pipefail
          mapfile -d '' sarif_files < <(
            find "$CODEQL_RESULTS" -type f -name '*.sarif' -print0
          )
          if [ "${#sarif_files[@]}" -eq 0 ]; then
            echo "::error::CodeQL produced no SARIF file to enforce." >&2
            exit 1
          fi
          finding_count="$(
            jq -s '[.[].runs[]?.results[]?] | length' "${sarif_files[@]}"
          )"
          if [ "$finding_count" -ne 0 ]; then
            echo "::error::CodeQL reported $finding_count active finding(s); zero are allowed." >&2
            exit 1
          fi
          echo "CodeQL reported zero active findings."
