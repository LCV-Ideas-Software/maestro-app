name: CodeQL
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "19 7 * * 2"
permissions: write-all
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    permissions: write-all
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          dependency-caching: true
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/codeql-results

      - name: Enforce zero CodeQL findings
        shell: bash
        env:
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-results
        run: |
          set -euo pipefail
          mapfile -d '' sarif_files < <(
            find "$CODEQL_RESULTS" -type f -name '*.sarif' -print0
          )
          if [ "${#sarif_files[@]}" -eq 0 ]; then
            echo "::error::CodeQL produced no SARIF file to enforce." >&2
            exit 1
          fi
          counts="$(
            jq -rs '
              [.[].runs[]?.results[]?] as $results
              | [
                  ($results | map(select(((.ruleId // "") | test("^[^/]+/diagnostic/")) | not)) | length),
                  ($results | map(select((.ruleId // "") | test("^[^/]+/diagnostic/"))) | length)
                ]
              | @tsv
            ' "${sarif_files[@]}"
          )"
          IFS=$'\t' read -r alert_count diagnostic_count <<< "$counts"
          if ! [[ "$alert_count" =~ ^[0-9]+$ && "$diagnostic_count" =~ ^[0-9]+$ ]]; then
            echo "::error::CodeQL SARIF classification did not return valid counts." >&2
            exit 1
          fi
          if [ "$diagnostic_count" -ne 0 ]; then
            echo "::notice::CodeQL reported $diagnostic_count extraction diagnostic(s); diagnostics are not security or quality alerts."
          fi
          if [ "$alert_count" -ne 0 ]; then
            echo "::error::CodeQL reported $alert_count security or quality alert(s); zero are allowed." >&2
            exit 1
          fi
          echo "CodeQL reported zero security or quality alerts."

  analyze-legacy-category:
    permissions: write-all
    name: Analyze legacy CodeQL category
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          dependency-caching: true

      # Temporary compatibility analysis for the historical code-scanning category:
      # older main-branch analyses used this default workflow/job category. Retain it
      # until stale analyses age out; server-side required status checks are not configured.
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: ".github/workflows/codeql.yml:analyze"
          output: ${{ runner.temp }}/codeql-results

      - name: Enforce zero CodeQL findings
        shell: bash
        env:
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-results
        run: |
          set -euo pipefail
          mapfile -d '' sarif_files < <(
            find "$CODEQL_RESULTS" -type f -name '*.sarif' -print0
          )
          if [ "${#sarif_files[@]}" -eq 0 ]; then
            echo "::error::CodeQL produced no SARIF file to enforce." >&2
            exit 1
          fi
          finding_count="$(
            jq -s '[.[].runs[]?.results[]?] | length' "${sarif_files[@]}"
          )"
          if [ "$finding_count" -ne 0 ]; then
            echo "::error::CodeQL reported $finding_count active finding(s); zero are allowed." >&2
            exit 1
          fi
          echo "CodeQL reported zero active findings."
