name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check public npm registry
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Biome
        run: npm run biome
      - name: Verify product PostEditor parity
        run: npm run parity:check
      - name: Check public HTML formatting
        run: npm run format:public:check
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  rust-gates:
    name: Rust gates (cargo --locked)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Setup Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: cargo check --locked
        working-directory: src-tauri
        run: cargo check --locked --all-targets
      - name: cargo test --locked
        working-directory: src-tauri
        run: cargo test --locked
      - name: cargo clippy --locked
        working-directory: src-tauri
        run: cargo clippy --locked --no-deps --all-targets

  audit-rustls-lock:
    name: Generate audited rustls lockfile
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/lcv-192-maestro-audit'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a0457be118748205dfbb7cbc6f08fc924ab5c7ba
          persist-credentials: false
      - name: Setup Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Regenerate lockfile with official Cargo
        shell: pwsh
        run: cargo update --manifest-path src-tauri/Cargo.toml -p rustls --precise 0.23.45
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcv192-maestro-rustls-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
