name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
      - .github/workflows/release.yml
      - .github/workflows/linear-release.yml
  workflow_dispatch:

permissions: {}
concurrency:
  group: release-main
  queue: max

jobs:
  prepare:
    name: Resolve release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve synchronized version and preserve published releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          tauri_version="$(jq -r .version src-tauri/tauri.conf.json)"
          cargo_version="$(python -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])')"
          [[ "$version" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-beta(0|[1-9][0-9]*))?$ ]] || {
            echo "::error::Expected X.Y.Z or X.Y.Z-betaN with 0-99 version components."
            exit 1
          }
          [[ "$version" == "$tauri_version" && "$version" == "$cargo_version" ]] || {
            echo "::error::package.json, Cargo.toml and tauri.conf.json versions differ."
            exit 1
          }
          core="${version%%-*}"
          suffix=""
          prerelease=false
          if [[ "$version" == *-* ]]; then
            suffix="-${version#*-}"
            prerelease=true
          fi
          IFS='.' read -r major minor patch <<< "$core"
          printf -v tag 'v%02d.%02d.%02d%s' "$major" "$minor" "$patch" "$suffix"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release="$(jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag)][0] // null' <<< "$releases")"
          if [[ "$(jq -r '.draft' <<< "$release")" == false ]]; then
            echo "Version $tag is already published; no rebuild, overwrite or new Linear release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]] || {
              echo "::error::Existing tag $tag names another commit. Use a new product version; do not move the tag."
              exit 1
            }
          fi
          if [[ "$release" != null ]]; then
            [[ "$(jq -r .target_commitish <<< "$release")" == "$GITHUB_SHA" ]] || {
              echo "::error::An existing draft is not bound to this exact source SHA."
              exit 1
            }
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    name: Validate and build Windows portable bundle
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Biome
        run: npm run biome
      - name: Verify product PostEditor parity
        run: npm run parity:check
      - name: Check public HTML formatting
        run: npm run format:public:check
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Frontend tests
        run: npm test
      - name: Setup Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: cargo test --locked
        working-directory: src-tauri
        run: cargo test --locked
      - name: cargo clippy --locked
        working-directory: src-tauri
        run: cargo clippy --locked --no-deps --all-targets
      - name: Build Tauri portable executable
        run: npm run tauri -- build --ci --no-bundle -- --locked
      - name: Package Windows executable and full legal notices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $stage = "release/Maestro-Editorial-AI-$tag-windows-x64-portable"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/maestro-editorial-ai.exe" -Destination "$stage/Maestro Editorial AI.exe"
          $documents = @("LEIAME.md", "LICENSE", "NOTICE", "THIRDPARTY.md", "THIRD-PARTY-NOTICES.txt", "CHANGELOG.md")
          foreach ($document in $documents) {
            Copy-Item -LiteralPath $document -Destination $stage
          }
          @"
          Maestro Editorial AI $tag

          Portable Windows 11+ bundle.
          Run "Maestro Editorial AI.exe" from this folder.

          This archive is the primary user-facing distribution format.
          It is intentionally not an installer and does not require a NuGet package.
          Runtime data is written under local app folders such as data/logs.
          "@ | Set-Content -LiteralPath "$stage/PORTABLE-RUN.txt" -Encoding utf8
          $zipName = "maestro-editorial-ai-$tag-windows-x64-portable.zip"
          $zip = "release/$zipName"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zip).Path)
          try {
            $required = $documents + @("Maestro Editorial AI.exe", "PORTABLE-RUN.txt")
            $missing = @($required | Where-Object { $_ -notin $archive.Entries.FullName })
            if ($missing.Count) { throw "Portable ZIP is missing: $($missing -join ', ')" }
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - name: Attest portable archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Upload portable archive
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-windows-portable-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: release
      - name: Publish or recover this exact release
        shell: bash
        run: |
          set -euo pipefail
          zip="release/maestro-editorial-ai-$RELEASE_TAG-windows-x64-portable.zip"
          (cd release && sha256sum --check --strict SHA256SUMS.txt)
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release="$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)][0] // null' <<< "$releases")"
          args=(--repo "$GITHUB_REPOSITORY" --title "Maestro Editorial AI $RELEASE_TAG")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          elif [[ "$release" == null || "$(jq -r .draft <<< "$release")" == true ]]; then
            # Explicitly promote a new stable release, but do not let an older
            # pre-publication retry move GitHub Latest or GHCR latest backwards.
            make_latest=true
            if [[ "$(jq '[.[][] | select(.draft == false and .prerelease == false)] | length' <<< "$releases")" -gt 0 ]]; then
              latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name | @uri')"
              relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest_tag...$GITHUB_SHA" --jq .status)"
              if [[ "$relation" != ahead ]]; then
                make_latest=false
              fi
            fi
            args+=(--latest="$make_latest")
          fi
          # --target only creates an absent tag; recheck any existing remote tag
          # after the Windows build, resolving annotated tags to their commit.
          tag_ref="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .ref")"
          if [[ -n "$tag_ref" ]]; then
            tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_ref" --jq .sha)"
            [[ "$tag_commit" == "$GITHUB_SHA" ]] || {
              echo "::error::Remote release tag names another commit. Refusing publication."
              exit 1
            }
          fi
          if [[ "$release" == null ]]; then
            gh release create "$RELEASE_TAG" "$zip" release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --generate-notes "${args[@]}"
          elif [[ "$(jq -r .draft <<< "$release")" == true ]]; then
            [[ "$(jq -r .target_commitish <<< "$release")" == "$GITHUB_SHA" ]] || {
              echo "::error::Refusing to modify a draft owned by another source commit."
              exit 1
            }
            gh release upload "$RELEASE_TAG" "$zip" release/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
          fi
          # Native immutable-release verification also covers a retry after the
          # publication succeeded but its previous job did not finish.
          gh release verify-asset "$RELEASE_TAG" "$zip" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$RELEASE_TAG" release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"

  mirror:
    name: Publish GitHub Package
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download the published portable bundle
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "maestro-editorial-ai-$RELEASE_TAG-windows-x64-portable.zip" --pattern SHA256SUMS.txt
          (cd release && sha256sum --check --strict SHA256SUMS.txt)
          gh release verify-asset "$RELEASE_TAG" "release/maestro-editorial-ai-$RELEASE_TAG-windows-x64-portable.zip" --repo "$GITHUB_REPOSITORY"
      - name: Mirror the canonical release ZIP to GHCR
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maestro-app-windows-portable"
          jq -n --arg tag "$RELEASE_TAG" --arg repository "https://github.com/$GITHUB_REPOSITORY" \
            '{name:"Maestro Editorial AI Windows portable bundle", tag:$tag, repository:$repository,
              distribution:"github-release-primary-ghcr-oci-mirror", nuget:false}' > release/package-metadata.json
          printf '%s\n' \
            "Maestro Editorial AI $RELEASE_TAG" \
            "OCI mirror of the Windows portable ZIP published in GitHub Releases." \
            "Human users should download the ZIP from GitHub Releases." > release/README.txt
          printf '%s\n' \
            'FROM scratch' \
            'LABEL org.opencontainers.image.title="Maestro Editorial AI Windows Portable Bundle"' \
            'LABEL org.opencontainers.image.description="OCI mirror of the GitHub Release portable Windows ZIP."' \
            "LABEL org.opencontainers.image.source=\"https://github.com/$GITHUB_REPOSITORY\"" \
            "LABEL org.opencontainers.image.version=\"$RELEASE_TAG\"" \
            'COPY . /' > "$RUNNER_TEMP/maestro.Dockerfile"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f "$RUNNER_TEMP/maestro.Dockerfile" -t "$image:$RELEASE_TAG" release
          docker push "$image:$RELEASE_TAG"
          # An older failed-job retry must not move a release channel backwards.
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          if [[ "$PRERELEASE" == true ]]; then
            channel=beta
            current="$(jq -r '[.[][] | select(.draft == false and .prerelease == true)] | sort_by(.published_at) | last | .tag_name // empty' <<< "$releases")"
          else
            channel=latest
            current="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          if [[ "$current" == "$RELEASE_TAG" ]]; then
            docker tag "$image:$RELEASE_TAG" "$image:$channel"
            docker push "$image:$channel"
          fi

  linear-release:
    name: Record published Windows release
    needs: [prepare, mirror]
    permissions:
      contents: read
    uses: $/.github/workflows/linear-release.yml
    secrets:
      LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
    with:
      version: ${{ needs.prepare.outputs.tag }}
