name: Maintenance
description: Dependency bumps, lockfiles, version bumps and routine upkeep
title: "[Maintenance]: "
type: Maintenance
body:
  - type: markdown
    attributes:
      value: |
        **Stop before filling this in.** If this work is prompted by a suspected vulnerability,
        a credential leak, exposure of private data, an authentication bypass, a payment-flow
        issue, a supply-chain issue, or a deployment misconfiguration, **do not use this
        public form** — report it privately through the channel in `SECURITY.md`.
  - type: markdown
    attributes:
      value: |
        Necessary nonsecret identifiers and configuration metadata may be included
        when useful for scope or validation under AGENTS.md. Use placeholders for
        confidential values; never paste credentials, private editorial material,
        personal data, or confidential agreement contents.
  - type: textarea
    id: what
    attributes:
      label: What needs upkeep
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
      description: Advisory, deprecation, drift, or scheduled upkeep.
    validations:
      required: true
  - type: textarea
    id: surfaces
    attributes:
      label: Surfaces touched
      description: Every file or configuration that must change together.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How it will be verified
      description: Which gates must pass before this is considered done.
    validations:
      required: true
