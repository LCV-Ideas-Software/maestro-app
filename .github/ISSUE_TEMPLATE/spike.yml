name: Spike
description: Time-boxed investigation with no guaranteed deliverable
title: "[Spike]: "
type: Spike
body:
  - type: markdown
    attributes:
      value: |
        **Stop before filling this in.** If this work is prompted by a suspected vulnerability,
        a credential leak, exposure of private data, an authentication bypass, a payment-flow
        issue, a supply-chain issue, or a deployment misconfiguration, **do not use this
        public form** — report it privately through the channel in `SECURITY.md`.
  - type: markdown
    attributes:
      value: |
        Necessary nonsecret identifiers and configuration metadata may be included
        when useful for scope or validation under AGENTS.md. Use placeholders for
        confidential values; never paste credentials, private editorial material,
        personal data, or confidential agreement contents.
  - type: textarea
    id: question
    attributes:
      label: Question to answer
      description: A single, decidable question. Not "look into X".
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What decision is blocked until this is answered.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: "e.g. 2 hours"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: What artifact ends this spike — a written answer, a benchmark, a prototype?
    validations:
      required: true
