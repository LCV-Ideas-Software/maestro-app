version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 3
      exclude:
        - "*"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 10
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
      codeql-action-security-updates:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 3
    groups:
      react:
        patterns:
          - "@types/react"
          - "@types/react-dom"
          - "react"
          - "react-dom"
        update-types:
          - "major"
          - "minor"
          - "patch"
      tiptap-editor:
        patterns:
          - "@tiptap/*"
          - "tiptap-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 10
