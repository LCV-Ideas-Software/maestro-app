version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
        - "github/*"
    rebase-strategy: auto
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      # Keep the existing product families together, including major updates:
      # React/React DOM and Tiptap extensions have coordinated peer constraints.
      react:
        applies-to: version-updates
        patterns:
          - "@types/react"
          - "@types/react-dom"
          - "react"
          - "react-dom"
        update-types:
          - "major"
          - "minor"
          - "patch"
      tiptap-editor:
        applies-to: version-updates
        patterns:
          - "@tiptap/*"
          - "tiptap-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
          - "react"
          - "react-dom"
          - "@tiptap/*"
          - "tiptap-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
